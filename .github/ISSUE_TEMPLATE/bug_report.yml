name: Bug Report
description: Report a bug or something that isn't working correctly in Xplorer.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please provide as much information as possible so I can investigate it.

  - type: input
    id: version
    attributes:
      label: Xplorer Version
      description: Which version of Xplorer are you using?
      placeholder: "1.0-pre1"
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android Version
      description: Which Android version is your device running?
      placeholder: "Android 14"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: What device are you using?
      placeholder: "Samsung Galaxy..."
    validations:
      required: false

  - type: textarea
    id: bug_description
    attributes:
      label: Describe the Bug
      description: Clearly explain what went wrong.
      placeholder: Tell me what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can I reproduce this bug?
      placeholder: |
        1. Open Xplorer.
        2. Navigate to...
        3. Tap...
        4. The bug occurs.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
      placeholder: I expected Xplorer to...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened?
      placeholder: Instead, Xplorer...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Screen Recordings
      description: Attach screenshots or recordings if they help explain the issue.
      placeholder: Drag and drop your attachments here.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Anything else that might help?
      placeholder: Additional details...
    validations:
      required: false
